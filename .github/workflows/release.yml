name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  # Needed for npm trusted publishing, which doesn't use a token
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5+, which comes with Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test

      - name: Upload plugin to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} src/index.mjs --clobber

      - name: Publish to npm
        run: npm publish
